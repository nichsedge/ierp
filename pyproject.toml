[project]
name = "ierp"
version = "0.1.0"
description = "Individual Enterprise Resource Planning — Personal Journal & CRM Event Log System with Google Contacts, Maps Timeline, and Live GPS Sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ierp = "ierp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ierp"]
