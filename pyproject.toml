[project]
name = "erp"
version = "0.1.0"
description = "Personal Journal & CRM Event Log System with Google Contacts, Maps Timeline, and Live GPS Sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
erp = "erp.manage_events:main"
manage-events = "erp.manage_events:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erp"]
