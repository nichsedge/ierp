[project]
name = "ierp"
version = "0.1.0"
description = "Individual Enterprise Resource Planning — Personal Journal & CRM Event Log System with Google Contacts, Maps Timeline, and Live GPS Sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ierp = "ierp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ierp"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["ierp/tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
